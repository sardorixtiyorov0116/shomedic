<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Shop</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      .header {
        background-color: #4caf50;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        color: white;
        margin: 0;
        width: 160px;
        height: 36px;
        object-fit: cover;
      }

      .menu-icon {
        width: 26px;
        height: 26px;
        cursor: pointer;
      }

      .container {
        padding: 10px;
        height: calc(100vh - 80px);
        overflow-y: auto;
        background-color: #f5f5f5;
      }
      .container::-webkit-scrollbar {
        width: 6px !important;
      }
      .container::-webkit-scrollbar-thumb {
        background: #4caf50 !important;
        border-radius: 2px !important;
      }

      .products {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        width: 100%;
      }

      .carts {
        display: flex;
        flex-wrap: wrap;
        /* gap: 16px; */
        justify-content: center;
        padding-bottom: 60px;
      }

      .card {
        width: 100%;
        min-height: 110px;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px;
        background-color: #4caf4f10;
        display: flex;
        gap: 4%;
      }

      .cart-item {
        width: 100%;
        min-height: 110px;
        border-bottom: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px;
        display: flex;
        gap: 4%;
      }

      .product-image {
        width: 30%;
        height: 100%;
        max-height: 120px;
        object-position: 0%;
        object-fit: contain;
      }

      .product-info {
        width: 66%;
        display: flex;
        flex-direction: column;
        gap: 4%;
      }
      .product-title {
        font-size: 14px;
        font-family: math;
        font-weight: 600;
        margin: 0;
      }
      .product-desc {
        font-size: 10px;
        color: #555;
        /* margin: 4px 0; */
        height: 22px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2; /* ikki qatorga cheklash */
        -webkit-box-orient: vertical;
      }

      .spacer {
        display: flex;
        margin-top: auto;
        justify-content: space-between;
        align-items: center;
      }
      .product-action {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .count {
        text-align: center;
        font-weight: 600;
      }
      .product-button {
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 24px;
        height: 24px;
        font-size: 16px;
        font-weight: 800;
      }

      .product-price {
        color: #4caf50;
        font-weight: bold;
        margin: 0;
      }

      .cartFooter {
        position: fixed;
        bottom: 0;
        height: 60px;
        width: 100%;
        left: 0;
        background-color: #f5f5f5;
        border-top: 1px solid #ddd;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
      }
      .checkout-container {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }

      .total {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
        color: #4caf50;
      }
      .quantity {
        font-size: 14px;
        color: #555;
        margin: 0;
      }

      .b {
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 600;
      }
      .hidden {
        display: none !important;
      }
      .cart-badge {
        position: absolute;
        top: -10px;
        right: -10px;
        background: rgb(6, 105, 6);
        color: white;
        border-radius: 50%;
        min-width: 20px;
        height: 20px;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .search {
        width: 100%;
        padding: 8px 12px 8px 36px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        background-color: #4caf4f10;

        background-image: url("./icons/search.svg");
        background-repeat: no-repeat;
        background-position: 12px center;
        background-size: 18px;
      }
      .search:focus {
        outline: none;
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }

      /* Sidebar */
      .sidebar {
        height: 100%;
        width: 250px; /* doimiy kenglik */
        position: fixed;
        top: 0;
        left: 0;
        background-color: #4caf50;
        overflow-x: hidden;
        padding-top: 20px;
        transform: translateX(-250px); /* yashirin holat */
        transition: transform 0.3s ease;
        z-index: 1000;
      }

      .sidebar.open {
        transform: translateX(0); /* ochilgan holat */
      }

      .sidebar a {
        padding: 10px 20px;
        text-decoration: none;
        color: white;
        display: block;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        margin-left: -10px;
        padding: 0 20px 10px 0;
        border-bottom: 1px solid #ffffff;
      }

      .sidebar a:hover {
        background: #575757;
      }

      /* Overlay */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 999;
      }

      .overlay.show {
        display: block;
      }

      .sidebar-content {
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: calc(100% - 100px);
      }

      .language-switcher {
        position: relative;
        display: flex;
        gap: 0;
        background: transparent;
        padding: 6px;
        border-radius: 10px;
        border: 1px solid #fff;
        justify-content: space-between;
      }

      .language-switcher .lang {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 0;
        border-radius: 8px;
        transition: color 0.3s ease;
        color: white;
        z-index: 2;
      }

      .language-switcher .lang.active {
        color: #fff;
      }

      /* Slider indicator */
      .language-switcher .slider {
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(50% - 4px);
        height: calc(100% - 8px);
        background: #377e3a;
        border-radius: 8px;
        transition: transform 0.3s ease;
        z-index: 1;
      }

      /* Agar active UZ bo‘lsa slider o‘ngga o‘tadi */
      .language-switcher .lang:nth-child(2).active ~ .slider {
        transform: translateX(100%);
      }

      .call-btn {
        width: 100%;
        color: white;
        border: 1px solid white;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .call-btn a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        padding: 0;
        font-size: 14px;
      }
      .call-btn a:hover {
        background-color: transparent;
      }

      .bottom-section {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .top-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .top-section p {
        color: white;
        font-size: 16px;
        margin: 0;
        cursor: pointer;
        font-weight: 500;
        border: 1px solid white;
        border-radius: 10px;
        padding: 10px 20px;
      }

      .modal {
        position: fixed;
        inset: 0; /* top, right, bottom, left = 0 */
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }
      .modal.hidden {
        display: none;
      }
      .modal-content {
        background: white;
        padding: 16px;
        border-radius: 8px;
        /* max-width: 80%; */
        max-width: 320px;
        position: relative;
      }
      .modal-content img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
      }
      .modal-info {
        margin-top: 12px;
      }
      .close-btn {
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }
      .m-name {
        font-size: 16px;
        font-weight: 600;
        text-align: center;
      }
      .m-desc {
        font-size: 12px;
        color: #555;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="menu-icon" id="burger" src="./icons/menu.svg" alt="" />
      <img class="brand" src="icons/shore_logo.png" alt="" />
      <div id="menu" style="position: relative">
        <img
          class="menu-icon cartBtn"
          src="./icons/cart.svg"
          alt=""
          id="cartBtn"
        />
        <span class="cart-badge hidden" id="cartBadge">0</span>
      </div>
      <div class="hidden back" id="back">
        <img class="menu-icon" src="./icons/back.svg" alt="" />
      </div>
      <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <img class="brand" src="icons/shore_logo.png" alt="" />
          <img
            style="margin-bottom: 8px"
            class="menu-icon"
            id="closeSidebar"
            src="./icons/close.svg"
            alt=""
          />
        </div>
        <div class="sidebar-content">
          <div class="top-section">
            <p class="back" id="home">Главная</p>
            <!-- <p id="orders">Заказы</p> -->
            <p class="cartBtn" id="cart">Корзина</p>
          </div>
          <div class="bottom-section">
            <div class="language-switcher">
              <button class="lang active">RU</button>
              <button class="lang">UZ</button>
              <span class="slider"></span>
            </div>
            <button class="call-btn" style="background: transparent">
              <img class="menu-icon" src="./icons/phone.svg" alt="" />
              <a href="tel:+1234567890" id="contact"> Связаться с нами</a>
            </button>
          </div>
        </div>
      </div>
      <div id="overlay" class="overlay"></div>
    </div>
    <div class="container">
      <div id="imageModal" class="modal hidden">
        <div class="modal-content">
          <span id="closeModal" class="close-btn">×</span>
          <img id="modalImage" src="" alt="" />
          <div class="modal-info">
            <p id="modalName" class="m-name"></p>
            <p id="modalDesc" class="m-desc"></p>
          </div>
        </div>
      </div>
      <div class="products" id="products">
        <input placeholder="Искать товары" class="search" id="searchInput" />
        <div id="productsList" class="products"></div>
      </div>
      <div class="hidden" id="product">
        <button class="b" id="backBtn">ORQAGA</button>
        <img
          src=""
          id="detailImage"
          alt=""
          style="width: 100%; height: 200px; object-fit: contain"
        />
        <p id="detailTitle"></p>
        <p id="detailDesc"></p>
      </div>
      <div class="hidden" id="cartContainer">
        <div class="carts" id="carts"></div>
        <div class="cartFooter" id="cartFooter">
          <div class="checkout-container">
            <div class="total-info">
              <span style="display: flex">
                <p class="total" id="total"></p>
                <span class="total" id="cur"></span>
              </span>
              <div style="display: flex">
                <p class="quantity" id="quantitys"></p>
                <span class="quantity" id="quantity"></span>
              </div>
            </div>
            <button class="b" id="order">Оформить</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      const tg = window.Telegram.WebApp;
      const API_URL = "http://shomedic.uz/api";
      tg.ready();

      const user = tg.initDataUnsafe.user;

      const productsContainer = document.getElementById("productsList");
      let cart = {};
      let productsData = [];
      let cartsData = [];
      const translations = {
        ids: [
          "contact",
          "home",
          "orders",
          "cart",
          "order",
          "empty1",
          "empty2",
          "quantitys",
        ],
        ru: [
          "Связаться с нами",
          "Главная",
          "Заказы",
          "Корзина",
          "Оформить",
          "Здесь пока пусто",
          "Здесь пока пусто",
          "Количество товаров:",
        ],
        uz: [
          "Biz bilan bog‘laning",
          "Bosh sahifa",
          "Buyurtmalar",
          "Korzinka",
          "Buyurtma berish",
          "Bu yer hozircha bo‘sh",
          "Bu yer hozircha bo‘sh",
          "Mahsulotlar soni: ",
        ],
      };

      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      const modalName = document.getElementById("modalName");
      const modalDesc = document.getElementById("modalDesc");

      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("product-image")) {
          modalImage.src = e.target.src;
          modalName.textContent = e.target.dataset.name;
          modalDesc.textContent = e.target.dataset.desc;
          modal.classList.remove("hidden");
        }
      });
      const closeModal = document.getElementById("closeModal");
      closeModal.addEventListener("click", () => {
        modal.classList.add("hidden");
      });

      // Overlayga bosilganda yopish
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.classList.add("hidden");
        }
      });

      // Toggle sidebar
      const burger = document.getElementById("burger");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const closeSidebar = document.getElementById("closeSidebar");

      burger.addEventListener("click", () => {
        sidebar.classList.add("open");
        overlay.classList.add("show");
      });

      overlay.addEventListener("click", () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      });

      closeSidebar.addEventListener("click", () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      });
      let lang = "ru";
      const langButtons = document.querySelectorAll(".language-switcher .lang");
      async function getUser() {
        await fetch(`${API_URL}/users/${user?.id || "8149535541"}`)
          .then((res) => res.json())
          .then((data) => {
            lang = data.lang || "ru";
            const userLang = data.lang || "ru";

            langButtons.forEach((b) => b.classList.remove("active"));
            const searchInput = document.getElementById("searchInput");
            if (userLang === "uz")
              searchInput.placeholder = "Mahsulot izlash...";
            else searchInput.placeholder = "Искать товары";
            translations.ids.forEach((id, index) => {
              const el = document.getElementById(id);
              if (el) {
                el.textContent = translations[userLang][index];
              }
            });

            langButtons.forEach((b) => {
              if (b.textContent === userLang.toUpperCase()) {
                b.classList.add("active");
              }
            });
          })
          .catch((err) => console.error("Userni olishda xatolik:", err));
        return lang;
      }
      getUser();
      langButtons.forEach((btn) => {
        btn.addEventListener("click", async () => {
          langButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          lang = btn.textContent.toLowerCase();

          const selectedLang = btn.textContent;
          await fetch(`${API_URL}/users/${user?.id || "8149535541"}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lang: selectedLang.toLowerCase() }),
          });
          // await getUser();
          const curEl = document.getElementById("cur");
          const currency = lang === "uz" ? "so'm" : "сум";
          curEl.innerText = `${currency}`;
          const searchInput = document.getElementById("searchInput");
          if (lang === "uz") searchInput.placeholder = "Mahsulot izlash...";
          else searchInput.placeholder = "Искать товары";
          translations.ids.forEach((id, index) => {
            const el = document.getElementById(id);
            if (el) {
              el.textContent = translations[lang][index];
            }
          });
          await renderProducts(productsData);
          await renderCartItems(cartsData);
        });
      });

      function updateCartBadge() {
        const badge = document.getElementById("cartBadge");

        const uniqueCount = Object.values(cart).filter((qty) => qty > 0).length;

        if (uniqueCount > 0) {
          badge.innerText = uniqueCount;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      }

      productsContainer.addEventListener("click", async (e) => {
        const id = e.target.dataset.id;
        if (!id) return;

        if (!cart[id]) cart[id] = 0;

        if (e.target.classList.contains("plus")) {
          const productId = e.target.dataset.id;
          await updateCart(productId, 1);
        }

        if (e.target.classList.contains("minus")) {
          const productId = e.target.dataset.id;
          await updateCart(productId, -1);
        }
        updateCartBadge();

        const countEl = document.getElementById(`count-${id}`);
        const minusBtn = document.querySelector(`.minus[data-id="${id}"]`);

        countEl.innerText = cart[id];

        if (cart[id] > 0) {
          countEl.classList.remove("hidden");
          minusBtn.classList.remove("hidden");
        } else {
          countEl.classList.add("hidden");
          minusBtn.classList.add("hidden");
        }
      });

      // productsContainer.addEventListener("click", (e) => {
      //   if (!e.target.classList.contains("product-title")) return;
      //   console.log("Title clicked");
      //   const id = e.target.dataset.id;
      //   const product = productsData.find((p) => p.id == id);
      //   if (!product) return;

      //   openProductDetail(product);
      // });

      function openProductDetail(product) {
        document.getElementById("products").classList.add("hidden");
        document.getElementById("product").classList.remove("hidden");

        document.getElementById("detailImage").src = product.photo;
        document.getElementById("detailTitle").innerText = product.name;
        document.getElementById("detailDesc").innerText = product.description;
      }

      document.getElementById("backBtn").addEventListener("click", () => {
        document.getElementById("product").classList.add("hidden");
        document.getElementById("products").classList.remove("hidden");
      });

      const cartBtns = document.querySelectorAll(".cartBtn");

      cartBtns.forEach((btn) => {
        btn.addEventListener("click", async () => {
          sidebar.classList.remove("open");
          overlay.classList.remove("show");
          document.getElementById("back").classList.remove("hidden");
          document.getElementById("products").classList.add("hidden");
          document.getElementById("cartContainer").classList.remove("hidden");
          document.getElementById("menu").classList.add("hidden");
        });
      });

      const backBtn = document.querySelectorAll(".back");
      backBtn.forEach((btn) => {
        btn.addEventListener("click", () => {
          sidebar.classList.remove("open");
          overlay.classList.remove("show");
          document.getElementById("cartContainer").classList.add("hidden");
          document.getElementById("back").classList.add("hidden");
          document.getElementById("products").classList.remove("hidden");
          document.getElementById("menu").classList.remove("hidden");
        });
      });

      const orderBtn = document.getElementById("order");

      orderBtn.addEventListener("click", async () => {
        try {
          orderBtn.disabled = true;
          const items = Object.entries(cart)
            .map(([id, quantity]) => {
              const product = productsData.find((p) => p.id === Number(id));
              if (!product) return null;
              return {
                product_id: product.id,
                product_name_uz: product.name_uz,
                product_name_ru: product.name_ru,
                price: product.price,
                quantity: quantity,
              };
            })
            .filter(Boolean);
          const response = await fetch(`${API_URL}/orders`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              user_id: String(user?.id || "8149535541"),
              items: items,
            }),
          });

          const data = await response.json();
          // console.log("Order yaratildi:", data);
          getCarts();
          if (window.Telegram?.WebApp?.close) {
            window.Telegram.WebApp.close();
          }
        } catch (error) {
          console.error("Order yaratishda xatolik:", error);
          alert("Xatolik yuz berdi. Qayta urinib ko‘ring.");
          orderBtn.disabled = false;
        }
      });

      async function getCarts() {
        const response = await fetch(
          `${API_URL}/carts/${user?.id || "8149535541"}`
        );
        const data = await response.json();

        cart = {};
        data.items.forEach((item) => {
          cart[item.product_id] = item.quantity;
        });

        cartsData = data.items;

        // umumiy quantity va total hisoblash
        const totalEl = document.getElementById("total");
        const curEl = document.getElementById("cur");

        const quantityEl = document.getElementById("quantity");

        quantityEl.innerText = ` ${data.items.reduce(
          (sum, item) => sum + item.quantity,
          0
        )}`;

        const total = data.items.reduce((sum, item) => {
          const product = productsData.find((p) => p.id === item.product_id);
          if (!product) return sum;
          return sum + product.price * item.quantity;
        }, 0);
        totalEl.innerText = `${total.toLocaleString()}`;
        const currency = lang === "uz" ? "so'm" : "сум";
        curEl.innerText = `${currency}`;

        renderCartItems(data.items);
      }

      function renderCartItems(items) {
        const cartsContainer = document.getElementById("carts");
        cartsContainer.innerHTML = "";
        updateCartBadge();

        if (items.length === 0) {
          document.getElementById("cartFooter").classList.add("hidden");
          cartsContainer.innerHTML =
            "<div style='height:calc(100vh - 150px); display:flex; align-items: center; justify-content: center; flex-direction:column;'><img src='./icons/box.svg' alt='Bo'sh savat' style='width: 200px; height: 200px;' /><p style='margin:0; color:#4caf50; font-size: 20px;' id='empty1'>Здесь пока пусто</p></div>";
          return;
        } else {
          document.getElementById("cartFooter").classList.remove("hidden");
        }

        items.forEach((item) => {
          const product = productsData.find((p) => p.id === item.product_id);
          if (!product) return;

          const productName = lang === "uz" ? product.name_uz : product.name_ru;
          const productDesc =
            lang === "uz" ? product.description_uz : product.description_ru;
          const currency = lang === "uz" ? "so'm" : "сум";

          const cartItem = document.createElement("div");
          cartItem.className = "cart-item";
          cartItem.innerHTML = `
      <img class="product-image" src="${
        product.photo
      }" data-name="${productName}" data-desc="${productDesc}">
      <div class="product-info">
        <p class="product-title">${productName}</p>
        <p class="product-desc">${productDesc}</p>
        <div class="spacer">
          <div style="display: flex; flex-direction: column;">
          <p style="margin:0; font-size:12px; color:#555; font-weight:600">${product.price.toLocaleString()} ${currency}</p>
          <p class="product-price">${(
            product.price * item.quantity
          ).toLocaleString()} ${currency}</p>
          </div>
          <div class="product-action">
            <button class="product-button minusc" data-id="${
              product.id
            }">-</button>
            <span class="count" id="count-${product.id}">${item.quantity}</span>
            <button class="product-button plusc" data-id="${
              product.id
            }">+</button>
          </div>
        </div>
      </div>
    `;
          cartsContainer.appendChild(cartItem);
          cartsData.forEach((item) => {
            const qty = cart[item.product_id] || 0;
            const countEl = document.getElementById(`count-${item.product_id}`);
            const minusBtn = document.querySelector(
              `.minus[data-id="${item.product_id}"]`
            );
            if (qty > 0) {
              countEl.innerText = qty;
              countEl.classList.remove("hidden");
              minusBtn.classList.remove("hidden");
            }
          });
        });
      }

      document.addEventListener("click", async (e) => {
        if (e.target.classList.contains("plusc")) {
          const productId = e.target.dataset.id;
          await updateCart(productId, 1);
        }

        if (e.target.classList.contains("minusc")) {
          const productId = e.target.dataset.id;
          await updateCart(productId, -1);
        }
      });

      async function updateCart(productId, change) {
        await fetch(`${API_URL}/cart/update`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            user_id: String(user?.id || "8149535541"),
            product_id: productId,
            change: change,
          }),
        });

        await getCarts();
      }

      let searchTimer;
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const value = e.target.value.trim();

        searchTimer = setTimeout(() => {
          loadProducts(value);
        }, 300);
      });

      async function loadProducts(search = "") {
        const url = search
          ? `${API_URL}/products?search=${encodeURIComponent(search)}`
          : `${API_URL}/products`;

        const response = await fetch(url);
        let products = await response.json();
        products = products.filter((p) => p.is_active);

        productsData = products;
        renderProducts(products);
        getCarts();
      }
      function renderProducts(products) {
        productsContainer.innerHTML = "";
        if (products.length === 0) {
          document.getElementById("searchInput").classList.add("hidden");
          productsContainer.innerHTML =
            "<div style='height:calc(100vh - 150px); display:flex; align-items: center; justify-content: center; flex-direction:column;'><img src='./icons/box.svg' alt='Bo'sh savat' style='width: 200px; height: 200px;' /><p style='margin:0; color:#4caf50; font-size: 20px;' id='empty2'>Здесь пока пусто</p></div>";
        } else {
          document.getElementById("searchInput").classList.remove("hidden");
        }

        products.forEach((product) => {
          if (!product.is_active) return;

          // lang ga qarab mos field tanlash
          const productName = lang === "uz" ? product.name_uz : product.name_ru;
          const productDesc =
            lang === "uz" ? product.description_uz : product.description_ru;
          const currency = lang === "uz" ? "so'm" : "сум";
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
      <img class="product-image" src="${
        product.photo
      }" data-name="${productName}" data-desc="${productDesc}">
      <div class="product-info">
        <p class="product-title" data-id="${product.id}">
          ${productName}
        </p>
        <p class="product-desc">${productDesc}</p>
        <div class="spacer">
          <p class="product-price">
            ${product.price.toLocaleString()} ${currency}
          </p>
          <div class="product-action">
            <button class="product-button minus hidden" data-id="${
              product.id
            }">-</button>
            <span class="count hidden" id="count-${product.id}">0</span>
            <button class="product-button plus" data-id="${
              product.id
            }">+</button>
          </div>
        </div>
      </div>
    `;

          productsContainer.appendChild(card);
        });
      }

      loadProducts();
    </script>
  </body>
</html>
